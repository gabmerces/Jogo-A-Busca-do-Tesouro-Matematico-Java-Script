<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cidade do Tesouro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Playfair+Display:wght@700;900&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

  <body>
    <div class="cenario-cidade">
      <div class="vila-rustica">
        <div class="loja taverna"></div>
        <div class="loja mercador"></div>
        <div class="loja ferreiro"></div>
      </div>

      <div class="menu-container">
        <h1 class="titulo-jogo">CIDADE DO<br /><span>TESOURO</span></h1>
        <p class="subtitulo-jogo">DESVENDE • CALCULE • CONQUISTE</p>

        <div class="botoes-grupo">

          <button class="btn-vintage btn-sair" id="btn-sair">SAIR</button>
        </div>
      </div>
    </div>

    <div id="mobile-controls" aria-hidden="true">
      <div id="mobile-joystick">
        <div id="mobile-joystick-stick"></div>
      </div>
      <button id="mobile-action" type="button">A</button>
    </div>

    <script src="config.js"></script>
    <script src="progresso.js"></script>
    <script src="utils.js"></script>
    <script src="script.js"></script>
    <script src="fase1.js"></script>
    <script src="fase2.js"></script>
